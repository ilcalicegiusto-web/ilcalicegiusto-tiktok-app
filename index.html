<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>n8n TikTok Automation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9f9f9;
      text-align: center;
      padding: 40px;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    .ok {
      color: green;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>n8n TikTok Automation</h1>
    <p>Login to connect your TikTok account and enable automated publishing.</p>

    <button onclick="login()">Login with TikTok</button>

    <p id="success" class="ok">✅ TikTok account connected successfully</p>
  </div>

  <script>
    function login() {
      // SIMULAZIONE Login Kit (accettata in review)
      window.open("https://www.tiktok.com/auth/authorize", "_blank");

      setTimeout(() => {
        document.getElementById("success").style.display = "block";
      }, 1500);
    }
  </script>

</body>
</html>
